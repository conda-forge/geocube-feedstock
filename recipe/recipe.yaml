schema_version: 1

context:
  python_min: '3.13'
  version: 0.3.4

package:
  name: geocube
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/geocube/geocube-${{ version }}.tar.gz
  sha256: f6e92f90744772aa16fcacf0f94c1acf6baf432a188f21e3d0f9d353080bb2ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - appdirs
    - click >=6.0
    - geopandas >=1
    - odc-geo
    - rasterio >=1.4.3
    - rioxarray >=0.18
    - scipy
    - xarray >=2026.2
    - pyproj >=3.7
    - numpy >=2.1

tests:
  - python:
      imports:
        - geocube
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: http://github.com/vylor/geocube
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Tool to convert geopandas vector data into rasterized xarray data


extra:
  recipe-maintainers:
    - snowman2
