{% set python_min = "3.10" %}
{% set name = "geocube" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/geocube-{{ version }}.tar.gz
  sha256: f6e92f90744772aa16fcacf0f94c1acf6baf432a188f21e3d0f9d353080bb2ec

build:
  entry_points:
    - geocube = geocube.cli.geocube:geocube
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - appdirs
    - click >=6.0
    - geopandas >=1
    - odc-geo
    - rasterio >=1.4.3
    - rioxarray >=0.18
    - scipy
    - xarray >=2026.2
    - pyproj >=3.7
    - numpy >=2.1

test:
  imports:
    - geocube
    - geocube.api
    - geocube.geo_utils
    - geocube.xarray_extensions
  commands:
    - pip check
    - geocube --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/corteva/geocube
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Tool to convert geopandas vector data into rasterized xarray data

extra:
  recipe-maintainers:
    - snowman2
    - ocefpaf
